name: ros_mobile
description: "ROS — Restaurant Operating System Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── HTTP / API ────────────────────────────────────────────────────────────
  dio: ^5.7.0
  retrofit: ^4.4.1

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Local Storage / Persistence ───────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.6.2

  # ── UI Components ─────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  fl_chart: ^0.69.0
  badges: ^3.1.2
  animations: ^2.0.11

  # ── Real-time / WebSocket ─────────────────────────────────────────────────
  socket_io_client: ^2.0.3+1

  # ── Form / Validation ─────────────────────────────────────────────────────
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0

  # ── Date & Time ───────────────────────────────────────────────────────────
  intl: ^0.20.0

  # ── Image / File ──────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  file_picker: ^8.1.3

  # ── QR Code ──────────────────────────────────────────────────────────────
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # ── Notifications ────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.4

  # ── Printing ─────────────────────────────────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.2

  # ── Utils ────────────────────────────────────────────────────────────────
  uuid: ^4.5.1
  collection: ^1.18.0
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3
  connectivity_plus: ^6.1.1
  permission_handler: ^11.3.1

  # ── Icons ────────────────────────────────────────────────────────────────
  font_awesome_flutter: ^10.8.0
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  retrofit_generator: ^9.1.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
