;; =============================================================================
;; ROS — Production PgBouncer Configuration
;; Optimized for Multi-Tenant SaaS, Prisma ORM & PostgreSQL 16
;; =============================================================================

[databases]
;; Direct mapping to PostgreSQL database
ros_db = host=postgres port=5432 dbname=ros_db auth_user=ros_user
;; Fallback catch-all for any tenant database
* = host=postgres port=5432 auth_user=ros_user

[pgbouncer]
;; ── Administrative Settings ──────────────────────────────────────────────────
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1
admin_users = ros_user, postgres
stats_users = ros_user, postgres, monitoring

;; ── Pool Mode Configuration ──────────────────────────────────────────────────
;; 'transaction': Connection is returned to pool as soon as transaction completes.
;; CRITICAL: Transaction mode allows multiplexing thousands of Prisma queries 
;; into 20-30 physical PostgreSQL server connections with near-zero connection overhead.
pool_mode = transaction

;; ── Connection & Pool Size Optimization ──────────────────────────────────────
;; Formula:
;;   PostgreSQL real max_connections: ~100
;;   PgBouncer default_pool_size: 20 - 30 (Matches Postgres optimal worker threads: 2 * vCPUs + Disk)
;;   PgBouncer max_client_conn: 1000 - 5000 (Handles spikes from API clusters, Socket.IO & Workers)

max_client_conn = 2000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 80
max_user_connections = 80

;; ── Timeouts & Keepalive ─────────────────────────────────────────────────────
server_idle_timeout = 60
server_connect_timeout = 15
server_login_retry = 3
client_idle_timeout = 0
client_login_timeout = 60
query_timeout = 0
query_wait_timeout = 120
idle_transaction_timeout = 60

;; ── TCP Keepalive ────────────────────────────────────────────────────────────
tcp_keepalive = 1
tcp_keepidle = 30
tcp_keepintvl = 10
tcp_keepcnt = 5

;; ── Low-Level Performance Tuning ─────────────────────────────────────────────
pkt_buf = 4096
max_packet_size = 2147483648
listen_backlog = 512
sbuf_loopcnt = 5
disable_pqexec = 0
ignore_startup_parameters = extra_float_digits, search_path, options
