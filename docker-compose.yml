version: '3.9'

services:
  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ros_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ros_user
      POSTGRES_PASSWORD: ros_pass
      POSTGRES_DB: ros_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ros_user -d ros_db']
      interval: 10s
      timeout: 5s
      retries: 10

  # ── PgBouncer (Connection Pooler for PostgreSQL) ───────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ros_pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: ros_user
      DB_PASSWORD: ros_pass
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ros_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      SERVER_IDLE_TIMEOUT: 60
      AUTH_TYPE: md5
    ports:
      - '6432:6432'
    depends_on:
      postgres:
        condition: service_healthy

  # ── MySQL 8 ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ros_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ros_db
      MYSQL_USER: ros_user
      MYSQL_PASSWORD: ros_pass
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'ros_user', '-pros_pass']
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ros_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ros_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Mailpit (local email testing) ──────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: ros_mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  # ── API Server ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: ros_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ros_user:ros_pass@pgbouncer:6432/ros_db?schema=public&pgbouncer=true&connection_limit=20
      DIRECT_URL: postgresql://ros_user:ros_pass@postgres:5432/ros_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production_min_64_chars_long
      JWT_REFRESH_SECRET: dev_refresh_secret_change_in_production_min_64_chars
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 30d
      API_PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: ros-uploads
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      BCRYPT_ROUNDS: 12
    ports:
      - '4000:4000'
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
    command: pnpm dev

  # ── Background Worker ──────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    container_name: ros_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ros_user:ros_pass@pgbouncer:6432/ros_db?schema=public&pgbouncer=true&connection_limit=20
      DIRECT_URL: postgresql://ros_user:ros_pass@postgres:5432/ros_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production_min_64_chars_long
      WORKER_CONCURRENCY: 3
    volumes:
      - ./apps/worker:/app/apps/worker
      - /app/apps/worker/node_modules

  # ── Web App ────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: ros_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next

  # ── Nginx ──────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ros_nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  mysql_data:
  redis_data:
  minio_data:
